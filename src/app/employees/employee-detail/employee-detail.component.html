<div class="container page">
  <a routerLink="/employees">&larr; Back to employees</a>

  <div *ngIf="!employee" class="alert alert-warning" style="margin-top:16px">Employee not found.</div>

  <div *ngIf="employee" class="card" style="margin-top:16px">
    <h2>{{ employee.firstName }} {{ employee.lastName }}
      <small>{{ employee.role }}</small>
    </h2>
    <dl class="dl-horizontal">
      <dt>Email</dt><dd><a href="mailto:{{ employee.email }}">{{ employee.email }}</a></dd>
      <dt>Location</dt><dd>{{ employee.location }}</dd>
      <dt>Joined on</dt><dd>{{ employee.joinedOn | date:'longDate' }}</dd>
      <dt>Status</dt><dd>{{ employee.active ? 'Active' : 'Inactive' }}</dd>
    </dl>
    <h4>About</h4>
    <div [innerHTML]="bioHtml"></div>
    <a [routerLink]="['/employees', employee.id, 'edit']" class="btn btn-default">Edit</a>
  </div>
</div>
