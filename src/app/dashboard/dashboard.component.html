<div class="container page">
  <h2>Dashboard <small class="muted">{{ now | date:'medium' }}</small></h2>
  <div class="row">
    <div class="col-sm-4"><div class="card"><div class="muted">Total employees</div><div class="stat">{{ total }}</div></div></div>
    <div class="col-sm-4"><div class="card"><div class="muted">Active</div><div class="stat">{{ active }}</div></div></div>
    <div class="col-sm-4"><div class="card"><div class="muted">Inactive</div><div class="stat">{{ inactive }}</div></div></div>
  </div>
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <h4>Employees by department</h4>
        <table class="table table-condensed">
          <tr *ngFor="let s of stats"><td>{{ s.name }}</td><td class="text-right">{{ s.count }}</td></tr>
        </table>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <h4>Recent joiners</h4>
        <ul class="list-unstyled">
          <li *ngFor="let e of recent">
            <a [routerLink]="['/employees', e.id]">{{ e.firstName }} {{ e.lastName }}</a>
            <span class="muted">– {{ e.role }}, joined {{ e.joinedOn | date:'mediumDate' }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
