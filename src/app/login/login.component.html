<div class="container page">
  <div class="row">
    <div class="col-md-4 col-md-offset-4">
      <div class="card">
        <h3>Sign in</h3>
        <form #loginForm="ngForm" (ngSubmit)="submit()" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" class="form-control" [(ngModel)]="username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required>
          </div>
          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
          <button type="submit" class="btn btn-primary btn-block" [disabled]="!loginForm.form.valid">Login</button>
        </form>
        <p class="muted" style="margin-top:12px">Demo: any username, password <code>demo</code></p>
      </div>
    </div>
  </div>
</div>
